<ion-app>
  <ion-split-pane contentId="main-content" when="lg" [disabled]="!autenticado()">
    <ion-menu contentId="main-content" type="overlay" [disabled]="!autenticado()">
      <ion-content>
        <div class="menu-layout">
          <div class="brand">
            <div class="brand-logo" aria-hidden="true">
              <ion-icon name="pulse"></ion-icon>
            </div>
            <div>
              <div class="brand-name">Oropouche</div>
              <div class="brand-tagline">Vigilancia y atención clínica</div>
            </div>
          </div>

          <ion-list lines="none" class="menu-list">
            <ion-menu-toggle auto-hide="false" *ngFor="let item of menu">
              <ion-item
                routerDirection="root"
                [routerLink]="[item.url]"
                routerLinkActive="selected"
                detail="false"
                button>
                <ion-icon aria-hidden="true" slot="start" [name]="item.icon + '-outline'"></ion-icon>
                <ion-label>{{ item.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>

          <div class="user-card" *ngIf="usuario() as u">
            <div class="user-avatar" aria-hidden="true">{{ iniciales() }}</div>
            <div class="user-info">
              <div class="user-name">{{ u.firstname }} {{ u.lastname }}</div>
              <div class="user-role">{{ rol() }}</div>
            </div>
            <ion-menu-toggle auto-hide="false">
              <ion-button fill="clear" color="medium" (click)="cerrarSesion()" aria-label="Cerrar sesión" title="Cerrar sesión">
                <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
              </ion-button>
            </ion-menu-toggle>
          </div>
        </div>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
