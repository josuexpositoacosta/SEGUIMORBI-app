<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Pacientes</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" (click)="nuevo()" aria-label="Nuevo paciente">
        <ion-icon slot="start" name="person-add-outline"></ion-icon>
        <span class="boton-texto">Nuevo paciente</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="barra-filtros">
    <ion-searchbar placeholder="Buscar por nombre o documento" [debounce]="150"
      (ionInput)="busqueda.set($any($event).detail.value ?? '')"></ion-searchbar>
    <ion-segment [value]="filtro()" (ionChange)="filtro.set($any($event).detail.value)">
      <ion-segment-button value="activos"><ion-label>Activos</ion-label></ion-segment-button>
      <ion-segment-button value="inactivos"><ion-label>Inactivos</ion-label></ion-segment-button>
      <ion-segment-button value="todos"><ion-label>Todos</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="cargar($any($event))">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="page-container">
    <div class="cargando" *ngIf="cargando()"><ion-spinner name="crescent"></ion-spinner></div>

    <app-estado-vacio *ngIf="!cargando() && errorCarga()" icono="cloud-offline-outline"
      titulo="No se pudieron cargar los pacientes" [texto]="errorCarga()">
      <ion-button fill="outline" (click)="cargar()">Reintentar</ion-button>
    </app-estado-vacio>

    <ng-container *ngIf="!cargando() && !errorCarga()">
      <app-estado-vacio *ngIf="!pacientes().length" icono="people-circle-outline"
        titulo="Todavía no hay pacientes en tu área" texto="Registra el primero para poder abrirle un caso.">
        <ion-button (click)="nuevo()"><ion-icon slot="start" name="person-add-outline"></ion-icon>Nuevo paciente</ion-button>
      </app-estado-vacio>

      <ng-container *ngIf="pacientes().length">
        <p class="resumen-lista">{{ filtrados().length }} de {{ pacientes().length }} pacientes</p>
        <app-estado-vacio *ngIf="!filtrados().length" icono="search-outline" titulo="Sin resultados"
          texto="Ningún paciente coincide con la búsqueda o el filtro."></app-estado-vacio>
      </ng-container>

      <div class="lista-registros">
        <button type="button" *ngFor="let p of filtrados()" class="registro" [class.inactivo]="!p.activo"
          (click)="abrirFicha(p)" [attr.aria-label]="'Ver ficha de ' + p.nombres + ' ' + p.apellidos">
          <div class="registro-avatar" aria-hidden="true">{{ iniciales(p) }}</div>
          <div class="registro-cuerpo">
            <div class="registro-titulo">{{ p.apellidos }}, {{ p.nombres }}</div>
            <div class="registro-detalle">
              {{ p.tipoDocumento }} {{ p.numeroDocumento }} · {{ textoEdad(p.fechaNacimiento) }} · {{ nombreSexo(p.sexo) }}
            </div>
            <div class="registro-etiquetas" *ngIf="!p.activo || p.telefono">
              <span class="etiqueta" *ngIf="p.telefono"><ion-icon name="call-outline" aria-hidden="true"></ion-icon>{{ p.telefono }}</span>
              <span class="etiqueta peligro" *ngIf="!p.activo">Inactivo</span>
            </div>
          </div>
          <ion-icon name="chevron-forward" class="registro-acciones" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </ng-container>
  </div>
</ion-content>
